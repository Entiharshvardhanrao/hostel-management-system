{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Leave Management</h2>

<div class="table-section">

<table class="table table-hover">

    <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Reason</th>
            <th>Status</th>
        </tr>

    </thead>

    <tbody>

        {% for leave in leaves %}

        <tr>

            <td>{{ leave.id }}</td>
            <td>{{ leave.student }}</td>
            <td>{{ leave.reason }}</td>
            <td>{{ leave.status }}</td>

        </tr>

        {% endfor %}

    </tbody>

</table>

</div>

{% endblock %}
