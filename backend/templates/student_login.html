<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(
                135deg,
                #071a52,
                #2563eb
            );

            font-family:Arial, Helvetica, sans-serif;

        }

        .login-wrapper{

            width:100%;

            max-width:1100px;

            display:flex;

            overflow:hidden;

            border-radius:30px;

            box-shadow:0 20px 60px rgba(0,0,0,.25);

            background:white;

        }

        .left-panel{

            width:50%;

            background:linear-gradient(
                135deg,
                #071a52,
                #2563eb
            );

            color:white;

            padding:60px;

            display:flex;

            flex-direction:column;

            justify-content:center;

        }

        .left-panel h1{

            font-size:45px;

            font-weight:bold;

            margin-bottom:20px;

        }

        .left-panel p{

            font-size:18px;

            opacity:.9;

        }

        .feature{

            margin-top:25px;

            font-size:17px;

        }

        .feature i{

            margin-right:10px;

            color:#93c5fd;

        }

        .right-panel{

            width:50%;

            padding:60px;

        }

        .login-title{

            font-size:32px;

            font-weight:bold;

            color:#071a52;

            margin-bottom:10px;

        }

        .login-subtitle{

            color:#6b7280;

            margin-bottom:35px;

        }

        .form-label{

            font-weight:600;

            color:#071a52;

        }

        .form-control{

            border-radius:15px;

            padding:14px;

            border:1px solid #dbe3f0;

        }

        .form-control:focus{

            border-color:#2563eb;

            box-shadow:none;

        }

        .login-btn{

            width:100%;

            background:linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color:white;

            border:none;

            padding:15px;

            border-radius:15px;

            font-size:17px;

            font-weight:600;

            transition:.3s;

        }

        .login-btn:hover{

            transform:translateY(-3px);

            color:white;

        }

        .logo{

            width:90px;

            height:90px;

            background:white;

            color:#2563eb;

            border-radius:50%;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:35px;

            margin-bottom:25px;

        }

        @media(max-width:768px){

            .login-wrapper{

                flex-direction:column;

                margin:20px;

            }

            .left-panel,
            .right-panel{

                width:100%;

            }

        }

    </style>

</head>

<body>

<div class="login-wrapper">

    <!-- LEFT SIDE -->

    <div class="left-panel">

        <div class="logo">

            <i class="fa fa-building"></i>

        </div>

        <h1>
            Hostel Management System
        </h1>

        <p>
            Smart hostel management platform for students and administrators.
        </p>

        <div class="feature">

            <i class="fa fa-circle-check"></i>

            Apply Leave Online

        </div>

        <div class="feature">

            <i class="fa fa-circle-check"></i>

            Raise Complaints Instantly

        </div>

        <div class="feature">

            <i class="fa fa-circle-check"></i>

            View Food Menu

        </div>

        <div class="feature">

            <i class="fa fa-circle-check"></i>

            Track Payments

        </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="right-panel">

        <h2 class="login-title">

            Student Login

        </h2>

        <p class="login-subtitle">

            Sign in to access your hostel dashboard

        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-4">

                <label class="form-label">

                    Email Address

                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>

            <button
                type="submit"
                class="login-btn">

                <i class="fa fa-right-to-bracket"></i>

                Login

            </button>

        </form>

    </div>

</div>

</body>

</html>
