<!DOCTYPE html>
<html>
<head>

    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#f4f6f9;
        }

        .profile-card{

            background:linear-gradient(
                135deg,
                #071a52,
                #2563eb
            );

            color:white;

            border-radius:25px;

            padding:40px;

            margin-bottom:30px;

        }

        .stat-card{

            background:white;

            border-radius:20px;

            padding:25px;

            text-align:center;

            box-shadow:0 5px 15px rgba(0,0,0,.08);

            transition:.3s;

        }

        .stat-card:hover{

            transform:translateY(-5px);

        }

        .stat-card i{

            font-size:40px;

            margin-bottom:15px;

        }

        .action-btn{

            padding:15px;

            border-radius:15px;

            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="container mt-5">

    <!-- PROFILE -->

    <div class="profile-card">

        <h2>
            Welcome {{ student.name }} 👋
        </h2>

        <p>
            {{ student.department }}
            |
            Year {{ student.year }}
        </p>

        <h5>
            Room Number:
            {{ student.room_number }}
        </h5>

    </div>



    <!-- STATS -->

    <div class="row g-4 mb-4">

        <div class="col-md-6">

            <div class="stat-card">

                <i class="fa fa-exclamation-circle text-danger"></i>

                <h3>
                    {{ complaint_count }}
                </h3>

                <p>
                    Complaints
                </p>

            </div>

        </div>

        <div class="col-md-6">

            <div class="stat-card">

                <i class="fa fa-calendar-check text-primary"></i>

                <h3>
                    {{ leave_count }}
                </h3>

                <p>
                    Leave Requests
                </p>

            </div>

        </div>

    </div>



    <!-- ACTIONS -->

    <div class="card p-4 shadow">

        <h3 class="mb-4">
            Quick Actions
        </h3>

        <div class="row g-3">

            <div class="col-md-3">

                <a href="/api/raise-complaint/"
                   class="btn btn-danger w-100 action-btn">

                    Raise Complaint

                </a>

            </div>

            <div class="col-md-3">

                <a href="/api/student-complaints/"
                   class="btn btn-warning w-100 action-btn">

                    My Complaints

                </a>

            </div>

            <div class="col-md-3">

                <a href="/api/apply-leave/"
                   class="btn btn-primary w-100 action-btn">

                    Apply Leave

                </a>

            </div>

            <div class="col-md-3">

                <a href="/api/my-leaves/"
                   class="btn btn-success w-100 action-btn">

                    My Leaves

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
