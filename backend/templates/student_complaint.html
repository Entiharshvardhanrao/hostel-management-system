```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raise Complaint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#eef2f7;
            font-family:Arial, Helvetica, sans-serif;
        }

        .complaint-container{
            max-width:900px;
            margin:auto;
            padding-top:50px;
        }

        .complaint-card{

            background:white;

            border-radius:30px;

            overflow:hidden;

            box-shadow:0 15px 40px rgba(0,0,0,.08);

        }

        .complaint-header{

            background:linear-gradient(
                135deg,
                #dc2626,
                #ef4444
            );

            color:white;

            padding:35px;

        }

        .complaint-header h2{

            font-weight:700;

            margin-bottom:10px;

        }

        .complaint-body{

            padding:40px;

        }

        .form-label{

            font-weight:600;

            color:#071a52;

            margin-bottom:10px;

        }

        .form-control{

            border-radius:15px;

            padding:14px;

            border:1px solid #dbe3f0;

        }

        .form-control:focus{

            border-color:#2563eb;

            box-shadow:none;

        }

        .info-box{

            background:#fff1f2;

            border-left:5px solid #ef4444;

            padding:15px;

            border-radius:12px;

            margin-bottom:25px;

        }

        .submit-btn{

            background:linear-gradient(
                135deg,
                #dc2626,
                #b91c1c
            );

            color:white;

            border:none;

            padding:15px 35px;

            border-radius:15px;

            font-weight:600;

            transition:.3s;

        }

        .submit-btn:hover{

            transform:translateY(-3px);

            color:white;

        }

        .dashboard-btn{

            border-radius:15px;

            padding:15px 25px;

        }

    </style>

</head>

<body>

<div class="container complaint-container">

    <div class="complaint-card">

        <!-- HEADER -->

        <div class="complaint-header">

            <h2>

                <i class="fa fa-triangle-exclamation"></i>

                Raise Complaint

            </h2>

            <p class="mb-0">

                Submit your complaint to hostel administration

            </p>

        </div>

        <!-- BODY -->

        <div class="complaint-body">

            <div class="info-box">

                <strong>Note:</strong>

                Please provide a clear title and detailed description for faster resolution.

            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-4">

                    <label class="form-label">

                        <i class="fa fa-heading"></i>

                        Complaint Title

                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Enter complaint title"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        <i class="fa fa-file-lines"></i>

                        Description

                    </label>

                    <textarea
                        name="description"
                        rows="6"
                        class="form-control"
                        placeholder="Describe your issue in detail..."
                        required></textarea>

                </div>

                <div class="d-flex gap-3">

                    <button
                        type="submit"
                        class="submit-btn">

                        <i class="fa fa-paper-plane"></i>

                        Submit Complaint

                    </button>

                    <a href="/api/student-dashboard/"
                       class="btn btn-dark dashboard-btn">

                        <i class="fa fa-home"></i>

                        Dashboard

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
```
