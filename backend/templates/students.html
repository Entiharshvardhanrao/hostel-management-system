```html
{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    Students Management
</h2>

<div class="table-section">

    <table class="table table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Room</th>
                <th>Department</th>
            </tr>

        </thead>

        <tbody>

            {% for student in students %}

            <tr>

                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.room_number }}</td>
                <td>{{ student.department }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
```
