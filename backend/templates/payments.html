{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Payments Management</h2>

<div class="table-section">

<table class="table table-hover">

    <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Amount</th>
            <th>Status</th>
        </tr>

    </thead>

    <tbody>

        {% for payment in payments %}

        <tr>

            <td>{{ payment.id }}</td>
            <td>{{ payment.student }}</td>
            <td>{{ payment.amount }}</td>
            <td>{{ payment.status }}</td>

        </tr>

        {% endfor %}

    </tbody>

</table>

</div>

{% endblock %}
