<!DOCTYPE html>
<html>
<head>

    <title>Apply Leave</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#f4f6f9;">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Apply Leave
        </h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label>From Date</label>

                <input type="date"
                       name="from_date"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>To Date</label>

                <input type="date"
                       name="to_date"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Reason</label>

                <textarea
                    name="reason"
                    rows="5"
                    class="form-control"
                    required></textarea>

            </div>

            <button class="btn btn-primary">

                Submit Leave Request

            </button>

        </form>

    </div>

</div>

</body>
</html>
