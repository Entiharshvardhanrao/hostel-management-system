```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Food Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#eef2f7;
            font-family:Arial, Helvetica, sans-serif;
        }

        .header-card{

            background:linear-gradient(
                135deg,
                #071a52,
                #2563eb
            );

            color:white;

            border-radius:25px;

            padding:35px;

            margin-bottom:30px;

            box-shadow:0 10px 30px rgba(0,0,0,.15);

        }

        .header-card h2{
            font-weight:700;
        }

        .dashboard-btn{

            background:white;

            color:#071a52;

            border:none;

            border-radius:12px;

            padding:12px 20px;

            font-weight:600;

        }

        .dashboard-btn:hover{

            background:#f3f4f6;

        }

        .menu-card{

            background:white;

            border-radius:25px;

            padding:25px;

            box-shadow:0 10px 25px rgba(0,0,0,.08);

            transition:.3s;

            height:100%;

            overflow:hidden;

            position:relative;

        }

        .menu-card:hover{

            transform:translateY(-8px);

        }

        .day-badge{

            background:linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color:white;

            padding:10px 18px;

            border-radius:30px;

            display:inline-block;

            margin-bottom:25px;

            font-weight:bold;

        }

        .food-section{

            background:#f8fafc;

            border-radius:15px;

            padding:15px;

            margin-bottom:15px;

        }

        .food-section i{

            width:30px;

            font-size:18px;

        }

        .food-title{

            font-weight:600;

            color:#071a52;

        }

        .food-text{

            margin-top:5px;

            color:#555;

        }

    </style>

</head>

<body>

<div class="container mt-5">

    <!-- HEADER -->

    <div class="header-card">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h2>
                    🍽 Weekly Food Menu
                </h2>

                <p class="mb-0">
                    Check your weekly hostel meal schedule
                </p>

            </div>

            <a href="/api/student-dashboard/"
               class="btn dashboard-btn">

                <i class="fa fa-home"></i>
                Dashboard

            </a>

        </div>

    </div>

    <!-- MENU CARDS -->

    <div class="row g-4">

        {% for menu in menus %}

        <div class="col-lg-4 col-md-6">

            <div class="menu-card">

                <div class="day-badge">

                    {{ menu.day }}

                </div>

                <div class="food-section">

                    <div class="food-title">

                        <i class="fa fa-mug-hot text-warning"></i>

                        Breakfast

                    </div>

                    <div class="food-text">

                        {{ menu.breakfast }}

                    </div>

                </div>

                <div class="food-section">

                    <div class="food-title">

                        <i class="fa fa-bowl-rice text-success"></i>

                        Lunch

                    </div>

                    <div class="food-text">

                        {{ menu.lunch }}

                    </div>

                </div>

                <div class="food-section">

                    <div class="food-title">

                        <i class="fa fa-utensils text-danger"></i>

                        Dinner

                    </div>

                    <div class="food-text">

                        {{ menu.dinner }}

                    </div>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
```
